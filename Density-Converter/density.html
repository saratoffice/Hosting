   <h2 style="text-align: center; text-decoration: underline;">Convert Fuel Density Using ASTM D1250: Table 53 B</h2>
  <div class="dual-forms-container">
    <!-- Original Form -->
    <div class="density-lookup-container">
      <h2>Find Density at Standard temperature (15°C)</h2>
      <div class="density-input-group">
        <label for="density-input">Observed Density in kg/m³:</label>
        <input type="number" id="density-input" placeholder="741.6" step="0.0001" />
      </div>
      <div class="density-input-group">
        <label for="temp-input">Observed Temp (°C):</label>
        <input type="number" id="temp-input" placeholder="29.8" step="0.1" />
      </div>
      <button class="calc-btn" onclick="calculateDensity()">Find Density at 15°C</button>
      <div class="density-input-group">
        <div class="result-box" id="density-result">
          <strong>Converted Density:</strong> <span>--</span> kg/m³
        </div>
      </div>
    </div>

    <!-- Reverse Form -->
    <div class="density-lookup-container">
      <h2>Find Density at Observed Temperature</h2>
      <div class="density-input-group">
        <label for="density15-input">Density at 15°C in kg/m³:</label>
        <input type="number" id="density15-input" placeholder="753.8" step="0.0001" />
      </div>
      <div class="density-input-group">
        <label for="temp-input-reverse">Observed Temp (°C):</label>
        <input type="number" id="temp-input-reverse" placeholder="29.8" step="0.1" />
      </div>
      <button class="calc-btn" onclick="calculateObservedDensity()">Find Density at Observed Temperature</button>
      <div class="density-input-group">
        <div class="result-box" id="observed-density-result">
          <strong>Converted Density:</strong> <span>--</span> kg/m³
        </div>
      </div>
    </div>
  </div>
